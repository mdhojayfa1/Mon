name: 💰 Automated AI Payout System
name: AI Reward Poster

on:
  schedule:
    - cron: '0 10 * * *' # Once a day at 10 AM UTC
  workflow_dispatch:

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
  post:
    runs-on: ubuntu-latest
    # Added timeout to prevent runaway resource usage
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: pip install google-generativeai beem requests

      - name: 🧠 AI Content Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/ai_content.py

      - name: 🚀 Multi-Blockchain Broadcast
        env:
          HIVE_USERNAME: ${{ secrets.HIVE_USERNAME }}
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
          STEEM_USERNAME: ${{ secrets.STEEM_USERNAME }}
          STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
        run: python src/hive_poster.py
      - name: Install dependencies
        run: pip install google-generativeai beem requests

      - name: Generate AI Content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_content.py

      - name: Post to Blockchain
        env:
          HIVE_USERNAME: ${{ secrets.HIVE_USERNAME }}
          HIVE_POSTING_KEY: ${{ secrets.HIVE_POSTING_KEY }}
        run: python scripts/hive_poster.py
